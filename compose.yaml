# Development build: manager, control agent and independent OpenVPN runtime.
# Runtime remains independent when the two management containers are recreated.
services:
  openvpn-runtime:
    build:
      context: .
      dockerfile: docker/Dockerfile.openvpn
    image: openvpn-ce:2.7.9-local
    container_name: openvpn-runtime
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    security_opt:
      - no-new-privileges:true
    ports:
      - "${OPENVPN_TCP_PORT:-1194}:1194/tcp"
    volumes:
      - runtime-ipc:/run/runtime
      - runtime-config:/etc/openvpn:ro
    environment:
      RUNTIME_IPC_KEY: /run/runtime/agent.key
      OPENVPN_CONFIG_PATH: /etc/openvpn/server.conf
    healthcheck:
      test: ["CMD", "/usr/local/bin/supervisor", "--check"]
      interval: 15s
      timeout: 3s
      retries: 3

  control-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    image: openvpn-ce-control-agent:0.1.0
    container_name: openvpn-control-agent
    restart: unless-stopped
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      OPENVPN_MANAGER_WRITE_ENABLED: ${OPENVPN_MANAGER_WRITE_ENABLED:-false}
      AGENT_SOCKET: /run/agent/control.sock
      RUNTIME_SOCKET: /run/runtime/control.sock
      RUNTIME_IPC_KEY: /run/runtime/agent.key
      AGENT_IPC_KEY: /run/agent/manager.key
      OPENVPN_PUBLIC_PORT: ${OPENVPN_TCP_PORT:-1194}
      AGENT_BACKUP_EXPORT_DIR: /data/export
    tmpfs:
      - /run/ca-pass:uid=10001,gid=10001,mode=0700
    volumes:
      - agent-ipc:/run/agent
      - runtime-ipc:/run/runtime:ro
      - agent-state:/data/agent
      - encrypted-backups:/data/export
      - runtime-config:/data/runtime-config
    healthcheck:
      test: ["CMD", "/usr/local/bin/control-agent", "--check"]
      interval: 15s
      timeout: 3s
      retries: 3

  manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.manager
    image: openvpn-ce-manager:0.1.0
    container_name: openvpn-manager
    restart: unless-stopped
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      OPENVPN_MANAGER_WRITE_ENABLED: ${OPENVPN_MANAGER_WRITE_ENABLED:-false}
      AGENT_SOCKET: /run/agent/control.sock
      AGENT_IPC_KEY: /run/agent/manager.key
      MANAGER_TLS_DIR: /data/manager/tls
      WEB_DIR: /app/web
      AGENT_BACKUP_EXPORT_DIR: /data/export
    ports:
      - "${MANAGER_BIND_IP:-127.0.0.1}:${MANAGER_HTTPS_PORT:-9443}:9443/tcp"
    volumes:
      - agent-ipc:/run/agent:ro
      - manager-state:/data/manager
      - encrypted-backups:/data/export:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/manager", "--check"]
      interval: 15s
      timeout: 3s
      retries: 3

  # One-shot offline recovery. Not started with normal `docker compose up`.
  # The tool only works when all three long-running services are stopped.
  recovery:
    profiles: ["recovery"]
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    image: openvpn-ce-control-agent:0.1.0
    user: "10001:10001"
    entrypoint: ["/usr/local/bin/recover"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      OPENVPN_MANAGER_WRITE_ENABLED: ${OPENVPN_MANAGER_WRITE_ENABLED:-false}
    volumes:
      - manager-state:/restore/manager
      - agent-state:/restore/agent
      - runtime-config:/restore/runtime
      - runtime-ipc:/restore/runtime-ipc
      - ./import:/import:ro

volumes:
  manager-state:
  agent-state:
  agent-ipc:
  runtime-ipc:
  runtime-config:
  encrypted-backups:
