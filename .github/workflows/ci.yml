name: CI — OpenVPN CE Manager
on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install native cryptography and database libraries
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libargon2-1
      - name: Unit tests
        run: go test ./...
      - name: IPC smoke test
        run: bash tests/integration/local-ipc.sh
      - name: Go vet
        run: go vet ./...
      - name: Go race tests
        run: go test -race ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JS dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: TypeScript + Vue build
        working-directory: frontend
        run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose validation
        run: docker compose --env-file .env.example config --quiet && docker compose --profile recovery --env-file .env.example config --quiet
      - name: Build three images with source signature checks
        run: docker compose --env-file .env.example build
      - name: Verify OpenVPN version
        run: docker run --rm --entrypoint /usr/local/sbin/openvpn openvpn-ce:2.7.9-local --version | head -n 1 | grep 'OpenVPN 2.7.9'
      - name: Verify offline recovery CLI is packaged
        run: docker run --rm --entrypoint /usr/local/bin/recover openvpn-ce-control-agent:0.1.0 --help
      - name: Easy-RSA 3.2.7 PKI compatibility smoke test
        run: bash tests/integration/easyrsa-container.sh
